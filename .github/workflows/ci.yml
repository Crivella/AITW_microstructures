name: ci

on:
    push:
        branches:
            - main
        paths:
            - "wood_microstructure/**"
            - "pyproject.toml"
            - ".github/workflows/ci.yml"
            - ".pre-commit-config.yaml"
            - "examples/**"
    pull_request:

concurrency:
  group: ${{format('{0}:{1}:{2}', github.repository, github.ref, github.workflow)}}
  cancel-in-progress: true

jobs:
    pre-commit:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Cache Python dependencies
              uses: actions/cache@v3
              with:
                  path: ~/.cache/pip
                  key: pip-pre-commit-${{ hashFiles('**/pyproject.toml') }}
                  restore-keys: pip-pre-commit-

            - name: Set up Python
              uses: actions/setup-python@v3
              with:
                  python-version: "3.13"

            - name: Install Python dependencies
              run: pip install -e .[pre-commit]

            - name: Run pre-commit
              run: pre-commit run --all-files || ( git status --short ; git diff ; exit 1 )

    run:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                python-version: ["3.11", "3.14"]

        steps:
            - uses: actions/checkout@v3

            - name: Cache Python dependencies
              uses: actions/cache@v3
              with:
                  path: ~/.cache/pip
                  key: pip-${{ matrix.python-version }}-tests-${{ hashFiles('**/pyproject.toml') }}
                  restore-keys: pip-${{ matrix.python-version }}-tests

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v3
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install Python dependencies
              run: pip install -e .

            - name: Run wood_ms
              run: |
                wood_ms --help

                wood_ms generate birch --config-file examples/small.json --random_seed 123
                [ -f SaveBirch_0/wood_microstructure.log ] || (
                    echo "Birch generation failed. Log file not found." ; exit 1
                )
                [ -f SaveBirch_0/params.json ] || ( echo "Birch generation failed. Params file not found." ; exit 1 )
                [ -f SaveBirch_0/FinalVolume3D/FinalVolume.nrrd ] || (
                    echo "Birch generation failed. Final volume file not found." ; exit 1
                )
                grep -q 'Time report:' SaveBirch_0/wood_microstructure.log || (
                    echo "Birch generation did not complete successfully" ; exit 1
                )
                grep -q '"random_seed": 123,' SaveBirch_0/params.json || (
                    echo "Birch generation did not use the override random seed" ; exit 1
                )

                wood_ms generate spruce --config-file examples/small.json --random_seed 456
                [ -f SaveSpruce_0/wood_microstructure.log ] || (
                    echo "Spruce generation failed. Log file not found." ; exit 1
                )
                [ -f SaveSpruce_0/params.json ] || ( echo "Spruce generation failed. Params file not found." ; exit 1 )
                [ -f SaveSpruce_0/FinalVolume3D/FinalVolume.nrrd ] || (
                    echo "Spruce generation failed. Final volume file not found." ; exit 1
                )
                grep -q 'Time report:' SaveSpruce_0/wood_microstructure.log || (
                    echo "Spruce generation did not complete successfully" ; exit 1
                )
                grep -q '"random_seed": 456,' SaveSpruce_0/params.json || (
                    echo "Spruce generation did not use the override random seed" ; exit 1
                )

                wood_ms postproc volume-convert-format SaveBirch_0/FinalVolume3D/FinalVolume.nrrd test.npy
                [ -f test.npy ] || ( echo "Volume conversion failed" ; exit 1 )
